# proxychains.conf  VER 4.x
# User-level config (~/.proxychains/proxychains.conf)
# This takes precedence over /etc/proxychains4.conf

# Dynamic chain — use one proxy at a time, skip dead ones
dynamic_chain

# Proxy DNS through the proxy too (prevents DNS leaks)
proxy_dns

# DNS subnet for remote DNS mapping
remote_dns_subnet 224

# Timeouts
tcp_read_time_out 15000
tcp_connect_time_out 8000

[ProxyList]
# Your proxy — HTTP on port 7897
http 127.0.0.1 7897
